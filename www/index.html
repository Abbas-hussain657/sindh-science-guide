*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.55;

.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;line-height:1.2}
a{color:var(--primary)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{margin:0 -16px;padding:22px 16px 26px;color:#fff;position:relative;
  background:
   conic-gradient(from 45deg at 50% 50%,rgba(255,255,255,.07) 0 25%,transparent 0 50%,rgba(255,255,255,.07) 0 75%,transparent 0) 0 0/28px 28px,

.seg{display:inline-flex;background:rgba(255,255,255,.14);border-radius:12px;padding:3px;gap:2px;margin-top:10px;width:max-content}

.sec h2{font-size:18px}.sec span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.subj{display:grid;gap:8px;align-content:start}
.badge{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--c)}

.subj b{font-family:var(--font-d);font-size:16px}

.bar{height:6px;border-radius:9px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);width:var(--w)}
.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}

.row b{display:block;font-weight:700}
.row small{color:var(--muted)}

.tick.on{background:var(--c);border-color:var(--c)}
.top{display:flex;align-items:center;gap:10px;padding:14px 0 6px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:700}
.tag{display:inline-block;background:var(--chip);color:var(--c);font-weight:700;font-size:13px;border-radius:99px;padding:3px 10px}
.lang{display:inline-flex;background:var(--chip);border-radius:12px;padding:3px;margin:10px 0}
.lang button{border:0;background:transparent;padding:6px 14px;border-radius:9px;font-weight:700;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.body p{margin:0 0 12px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border-radius:10px;padding:5px 11px;font-weight:600;font-size:14px}
.qs{margin:0;padding-left:20px;display:grid;gap:8px}
.cta{border:0;background:var(--c);color:#fff;font-weight:800;border-radius:14px;padding:13px 16px;width:100%;margin-top:14px}
.cta.off{background:var(--chip);color:var(--ink)}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.navrow button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-weight:700}
.navrow button:disabled{opacity:.4}
.search{width:100%;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:13px 14px;font:inherit;margin-top:14px}
.note{font-size:14px;color:var(--muted);background:var(--chip);border-radius:12px;padding:10px 12px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px));z-index:5}
.tabs div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tabs button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:6px;border-radius:12px;color:var(--muted);font-weight:700;font-size:12px}
.tabs button[aria-current="page"]{color:var(--primary);background:var(--chip)}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.links{display:grid;gap:8px}
.links a{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;font-weight:700;background:var(--surface)}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .12s}.card:active{transform:scale(.98)}}

bio9:{sub:"bio",cls:9,src:"BSEK syllabus 2024-25 (7 chapters)",papers:[["English medium",PP+"karachi-board-9th-biology-english-medium.aspx"],["Urdu medium",PP+"karachi-board-9th-biology-urdu-medium.aspx"]],units:[
["Introduction to Biology","Biology is the study of living things. It is divided into branches such as botany (plants), zoology (animals), microbiology, genetics and ecology. Biology is linked to other sciences: biochemistry (chemistry), biophysics (physics), biostatistics (maths) and environmental science (geography).","Biology zinda cheezon ka mutalia hai. Iski shakhain hain: botany (paudhay), zoology (janwar), microbiology, genetics aur ecology. Ye doosre science se juri hui hai, jaise chemistry se biochemistry aur physics se biophysics.",["Botany","Zoology","Microbiology","Genetics","Biochemistry","Ecology"],["Define biology.","Name any four branches of biology and what each studies.","How is biology related to chemistry and physics?"]],
["Solving a Biological Problem","Scientists solve problems with the biological method: recognise the problem, observe, form a hypothesis, make a deduction, do an experiment (with a control and one changing variable), record results and reach a conclusion. Francesco Redi's meat and flies experiment showed that maggots do not appear by themselves.","Scientist masla hal karne ke liye biological method use karte hain: masla pehchano, observation, hypothesis, deduction, experiment, nateeja aur conclusion. Experiment mein ek control hota hai aur sirf ek variable badla jata hai. Redi ke experiment se pata chala ke keede khud ba khud paida nahi hote.",["Hypothesis","Deduction","Control","Variable","Theory","Law"],["What is a hypothesis?","Write the steps of the biological method.","Differentiate between control and experimental group."]],
["Biodiversity","Biodiversity means the variety of living things. Classification groups organisms by similarity. Aristotle, Linnaeus and Whittaker contributed to it. The five kingdoms are Monera, Protista, Fungi, Plantae and Animalia. Binomial nomenclature (Linnaeus) names an organism with genus and species, e.g. Homo sapiens. The ranks run Kingdom, Phylum, Class, Order, Family, Genus, Species.","Biodiversity ka matlab hai zindagi ki qismein. Classification mein milti julti cheezon ko ek group mein rakhte hain. Paanch kingdom hain: Monera, Protista, Fungi, Plantae, Animalia. Linnaeus ne binomial nomenclature diya, yaani genus aur species ka naam, jaise Homo sapiens. Biodiversity bachana bhi zaroori hai.",["Taxonomy","Five kingdoms","Binomial nomenclature","Genus","Species","Conservation"],["Define biodiversity.","Write the five kingdoms with one example each.","What is binomial nomenclature? Give an example.","Why do we conserve biodiversity?"]],
["Cells and Tissues","Cell theory: all living things are made of cells, the cell is the unit of life and cells come from existing cells (Schleiden, Schwann, Virchow). Robert Hooke first saw cells in cork. A cell has a membrane, cytoplasm and nucleus; plant cells also have a cell wall, chloroplasts and a large vacuole. Mitochondria release energy and ribosomes make protein. Substances move by diffusion, osmosis and active transport. Plant tissues are meristematic and permanent; animal tissues are epithelial, connective, muscular and nervous.","Cell theory: har jandar cell se bana hai, cell zindagi ki ikai hai aur nayi cell purani cell se banti hai. Hooke ne sabse pehle cork mein cell dekha. Cell mein membrane, cytoplasm aur nucleus hote hain; paudhe ki cell mein cell wall aur chloroplast bhi hota hai. Mitochondria energy dete hain. Cheezein diffusion, osmosis aur active transport se andar bahar jati hain.",["Cell theory","Nucleus","Mitochondria","Chloroplast","Diffusion","Osmosis","Tissue"],["State the cell theory.","Differentiate between plant and animal cell.","Define osmosis and diffusion.","Name the four types of animal tissue."]],
["Cell Cycle","Chromosomes carry genes and consist of two chromatids joined at a centromere. The cell cycle has interphase (G1, S, G2) and cell division. Mitosis makes two identical cells for growth and repair: prophase, metaphase, anaphase, telophase. Meiosis makes four cells with half the chromosomes (gametes) and includes crossing over. Necrosis is death by injury; apoptosis is programmed cell death.","Chromosome mein genes hote hain, ye do chromatid aur ek centromere se bante hain. Cell cycle mein interphase (G1, S, G2) aur division hota hai. Mitosis se do ek jaisi cells bante hain (growth aur repair ke liye): prophase, metaphase, anaphase, telophase. Meiosis se chaar cells bante hain jinme chromosome aadhe hote hain.",["Chromosome","Interphase","Mitosis","Meiosis","Crossing over","Apoptosis"],["Differentiate between mitosis and meiosis.","Write the phases of mitosis.","What is the difference between necrosis and apoptosis?"]],
["Nutrition","Plants are autotrophs: photosynthesis makes glucose from carbon dioxide and water using light and chlorophyll (6CO2 + 6H2O -> C6H12O6 + 6O2). A balanced diet in man has carbohydrates, proteins, fats, vitamins, minerals, water and fibre. Digestion breaks food down: amylase in the mouth, pepsin in the stomach, bile and lipase in the small intestine, where villi absorb digested food.","Paudhe apni khurak khud banate hain (photosynthesis): light aur chlorophyll se carbon dioxide aur pani se glucose banta hai. Insan ki balanced diet mein carbohydrates, proteins, fats, vitamins, minerals, pani aur fibre hote hain. Hazam mein mouth mein amylase, stomach mein pepsin aur small intestine mein bile aur lipase kaam karte hain; villi khurak jazb karte hain.",["Photosynthesis","Chlorophyll","Balanced diet","Enzyme","Villi","Digestion"],["Write the equation of photosynthesis.","What is a balanced diet?","Describe digestion in the small intestine."]],
["Transport","In plants, xylem carries water and minerals up from the roots and phloem carries food; water is lost through stomata in transpiration, which also pulls water upward. In man, blood (plasma, red cells, white cells, platelets) is pumped by the four-chambered heart. Arteries carry blood away from the heart, veins bring it back and capillaries exchange materials with tissues. Man has double circulation.","Paudhon mein xylem pani aur minerals oopar le jata hai aur phloem khurak. Pattiyon ke stomata se pani udta hai (transpiration). Insan mein khoon (plasma, RBC, WBC, platelets) ko chaar khano wala dil pump karta hai. Arteries khoon dil se door le jati hain, veins wapas laati hain aur capillaries tissues se len den karti hain.",["Xylem","Phloem","Transpiration","Artery","Vein","Capillary","Heart"],["Differentiate between xylem and phloem.","Differentiate between artery and vein.","Describe the structure of the human heart.","What is transpiration?"]]
]},
bio10:{sub:"bio",cls:10,src:"BSEK syllabus 2024-25 (7 chapters)",papers:[["English medium",PP+"karachi-board-10th-biology-english-medium.aspx"]],units:[
["Gaseous Exchange","Gaseous exchange is the intake of oxygen and release of carbon dioxide. Earthworms use skin, fish use gills, insects use tracheae and mammals use lungs; plants use stomata and lenticels. In man air passes nose, pharynx, larynx, trachea, bronchi, bronchioles and alveoli, where exchange occurs. Breathing uses the diaphragm and rib muscles. Smoking damages lungs and causes bronchitis and cancer.","Gaseous exchange matlab oxygen lena aur carbon dioxide nikalna. Kehchua skin se, machli gills se, keede tracheae se aur insan phephron se saans lete hain; paudhe stomata aur lenticels se. Insan mein hawa nose, pharynx, larynx, trachea, bronchi aur alveoli tak jati hai jahan len den hota hai. Smoking phephron ko kharab karti hai.",["Alveoli","Diaphragm","Trachea","Stomata","Gills","Bronchitis"],["Differentiate between breathing and respiration.","Describe the human respiratory pathway.","Write the harmful effects of smoking."]],
["Homeostasis","Homeostasis keeps the internal environment steady. Plants lose extra water by transpiration and guttation. In man the kidneys filter blood: each nephron performs filtration, reabsorption and secretion to form urine. Skin controls body temperature through sweating and blood vessels. Kidney failure is treated with dialysis or a transplant.","Homeostasis ka matlab jism ke andar ka mahaul theek rakhna. Kidney khoon saaf karti hai: har nephron mein filtration, reabsorption aur secretion se peshab banta hai. Jild paseena la kar jism ka temperature theek rakhti hai. Kidney kharab ho jaye to dialysis ya transplant hota hai.",["Nephron","Urine","Dialysis","Osmoregulation","Thermoregulation"],["Define homeostasis.","Describe the structure of a nephron.","How does the skin regulate temperature?"]],
["Coordination and Control","The nervous system coordinates quickly: neurons carry impulses; the brain (cerebrum, cerebellum, medulla) and spinal cord control the body; a reflex arc gives fast automatic responses. Receptors such as the eye and ear detect stimuli. The endocrine system works slowly through hormones: insulin (blood sugar), thyroxine (metabolism), adrenaline (emergency) and growth hormone from the pituitary gland.","Nervous system tezi se coordination karta hai: neuron signal le jate hain, dimagh (cerebrum, cerebellum, medulla) aur spinal cord jism ko control karte hain. Reflex arc se fori khud ba khud jawab milta hai. Endocrine system hormones se aahista kaam karta hai: insulin, thyroxine, adrenaline aur growth hormone.",["Neuron","Reflex arc","Cerebrum","Hormone","Insulin","Pituitary gland"],["Differentiate between nervous and chemical coordination.","What is a reflex arc?","Name four hormones and their functions."]],
["Support and Movement","Support gives shape and protection and movement allows locomotion. Skeletons are hydrostatic, exoskeleton or endoskeleton. The human skeleton has the axial part (skull, vertebral column, ribs, sternum) and the appendicular part (limbs and girdles). Ball-and-socket joints (shoulder, hip) move in all directions; hinge joints (elbow, knee) move in one plane. Muscles work in antagonistic pairs, e.g. biceps and triceps at the elbow.","Support se jism ko shakal aur hifazat milti hai aur movement se hum chalte hain. Skeleton ki qismein: hydrostatic, exoskeleton aur endoskeleton. Insani skeleton axial (khopdi, reedh, pasliyan) aur appendicular (haath paon) hissay par mushtamil hai. Shoulder aur hip ball-and-socket joint hain, elbow aur knee hinge joint. Biceps aur triceps ek doosre ke ulat kaam karte hain.",["Axial skeleton","Appendicular skeleton","Ball and socket joint","Hinge joint","Antagonistic muscles"],["Differentiate between axial and appendicular skeleton.","Differentiate between ball-and-socket and hinge joints.","How do biceps and triceps move the forearm?"]],
["Reproduction","Plants reproduce asexually by runners, tubers, bulbs and cuttings, and sexually through flowers: pollination, fertilisation, then seed and fruit formation. Animals reproduce asexually by binary fission or budding. In the rabbit, sexual reproduction involves male and female gametes (sperm and egg), internal fertilisation, development in the uterus and birth of young.","Paudhe asexual tareeqon (runners, tubers, bulbs, cuttings) aur phoolon se sexual tareeqay se paida hote hain: pollination, fertilisation phir beej aur phal. Janwaron mein asexual reproduction binary fission ya budding se hota hai. Khargosh mein sperm aur egg milte hain, bachcha uterus mein parwaan chadhta hai.",["Pollination","Fertilisation","Binary fission","Budding","Gamete"],["Differentiate between asexual and sexual reproduction.","Define pollination and fertilisation.","Describe reproduction in the rabbit."]],
["Man and His Environment","An ecosystem includes living (biotic) and non-living (abiotic) parts. Levels: organism, population, community, ecosystem, biosphere. Energy flows one way through a food chain (about 10 percent passes to the next level) while materials such as carbon, nitrogen and water cycle. Pollution and deforestation harm nature, so we conserve forests, water and wildlife.","Ecosystem mein zinda (biotic) aur be-jaan (abiotic) cheezein hoti hain. Energy food chain mein aik hi taraf behti hai (taqreeban 10 fisad agle level tak jati hai) jabke carbon, nitrogen aur pani cycle mein ghoomte hain. Pollution aur jungle ki katai nuqsan karte hain, isliye qudrat ko bachana zaroori hai.",["Ecosystem","Food chain","Food web","Carbon cycle","Nitrogen cycle","Conservation"],["Define ecosystem.","Draw and explain a food chain.","Describe the carbon cycle."]],
["Biotechnology","Biotechnology uses living organisms to make useful products. Fermentation by yeast makes bread rise and produces alcohol. Genetic engineering moves a gene from one organism to another using recombinant DNA; for example, bacteria are made to produce human insulin. Genetically modified crops can resist pests or give better yield.","Biotechnology mein jandaron se faida mand cheezein banayi jati hain. Khameer (yeast) ka fermentation roti ko phulata hai. Genetic engineering mein ek jandar ka gene doosre mein daalte hain (recombinant DNA); jaise bacteria se insani insulin banti hai. GM fasalein keeron ka muqabla kar sakti hain.",["Fermentation","Yeast","Genetic engineering","Recombinant DNA","Insulin"],["Define biotechnology.","What is genetic engineering?","How is insulin produced using bacteria?"]]
]},
chem9:{sub:"chem",cls:9,src:"Chapters 1-4 standard topics, 5-8 from BSEK reduced syllabus",papers:[["English medium",PP+"karachi-board-9th-chemistry-english-medium.aspx"],["Urdu medium",PP+"karachi-board-9th-chemistry-urdu-medium.aspx"]],units:[
["Fundamentals of Chemistry","Chemistry studies matter and its changes. Its branches include organic, inorganic, physical, analytical and biochemistry. Matter is classified into elements, compounds and mixtures. A mole is 6.022 x 10^23 particles (Avogadro's number). Relative atomic mass compares an atom with carbon-12, and stoichiometry uses balanced equations to calculate amounts.","Chemistry maadday aur uski tabdeeliyon ka mutalia hai. Iski shakhain: organic, inorganic, physical, analytical aur biochemistry. Maadda element, compound aur mixture mein taqseem hota hai. Ek mole mein 6.022 x 10^23 zarray hote hain (Avogadro number). Balanced equation se miqdar nikalna stoichiometry kehlata hai.",["Element","Compound","Mixture","Mole","Avogadro number","Stoichiometry"],["Define a mole.","Differentiate between element, compound and mixture.","Name the branches of chemistry."]],
["Structure of Atoms","An atom has a nucleus of protons and neutrons with electrons in shells around it. Thomson found the electron, Rutherford the nucleus, Bohr the shells and Chadwick the neutron. Atomic number is the number of protons; mass number is protons plus neutrons. Isotopes have the same atomic number but different mass numbers, such as protium, deuterium and tritium. Electrons fill shells as 2, 8, 8.","Atom ke markaz (nucleus) mein proton aur neutron hote hain aur electron shells mein ghoomte hain. Thomson ne electron, Rutherford ne nucleus, Bohr ne shells aur Chadwick ne neutron dariyaft kiya. Atomic number proton ki tadaad hai, mass number proton aur neutron ka majmua. Isotopes ka atomic number same magar mass number alag hota hai. Electrons 2, 8, 8 ke hisaab se bharte hain.",["Proton","Neutron","Electron","Atomic number","Mass number","Isotope"],["Define isotopes with examples.","Write the electronic configuration of sodium and chlorine.","Compare Rutherford's and Bohr's models."]],
["Periodic Table and Periodicity","Mendeleev arranged elements by atomic mass; the modern periodic law uses atomic number. The table has groups (vertical) and periods (horizontal). Across a period atomic size decreases and ionisation energy and electronegativity increase; down a group size increases. Group 1 is alkali metals, group 17 halogens and group 18 noble gases.","Mendeleev ne elements ko atomic mass se tarteeb diya; jadeed law atomic number par hai. Table mein groups (khadi) aur periods (aadi) hoti hain. Period mein aage barhne par atomic size kam aur ionisation energy barhti hai; group mein neeche jaane par size barhta hai. Group 1 alkali metals, group 17 halogens aur group 18 noble gases hain.",["Group","Period","Ionisation energy","Electronegativity","Alkali metals","Halogens"],["State the modern periodic law.","How does atomic size change across a period and down a group?","Name the properties of noble gases."]],
["Structure of Molecules","Atoms bond to reach a stable octet. An ionic bond forms by transfer of electrons (NaCl). A covalent bond forms by sharing electrons (H2 single, O2 double, N2 triple). A coordinate covalent bond has both shared electrons from one atom. Ionic compounds have high melting points and conduct when molten; covalent compounds usually do not. Hydrogen bonds and dipole forces act between molecules.","Atoms muqarrar octet hasil karne ke liye bond banate hain. Ionic bond electron ke muntaqil hone se banta hai (NaCl). Covalent bond electron share karne se banta hai (H2 single, O2 double, N2 triple). Ionic compounds ka melting point zyada hota hai aur pighalne par bijli guzarte hain. Molecules ke darmiyan hydrogen bond aur dipole forces hoti hain.",["Octet rule","Ionic bond","Covalent bond","Coordinate bond","Hydrogen bond","Polar molecule"],["Differentiate between ionic and covalent compounds.","Explain the formation of NaCl.","What is a hydrogen bond?"]],
["Physical States of Matter","Gas laws: Boyle's law (P1V1 = P2V2 at constant temperature) and Charles's law (V1/T1 = V2/T2 at constant pressure, temperature in kelvin; K = C + 273). Liquids show evaporation, vapour pressure and boiling point. Solids are crystalline or amorphous. Allotropy is the existence of an element in different forms, e.g. diamond and graphite of carbon.","Gas laws: Boyle ka qanoon (P1V1 = P2V2, temperature same) aur Charles ka qanoon (V1/T1 = V2/T2, pressure same, temperature kelvin mein; K = C + 273). Liquid mein evaporation, vapour pressure aur boiling point hote hain. Solid crystalline ya amorphous hota hai. Allotropy mein aik element mukhtalif shakal mein milta hai, jaise carbon ka diamond aur graphite.",["Boyle's law","Charles's law","Kelvin","Vapour pressure","Allotropy","Crystalline solid"],["State Boyle's law and Charles's law.","Define allotropy with an example.","Differentiate between crystalline and amorphous solids."]],
["Solutions","A solution is a homogeneous mixture of solute and solvent. It can be unsaturated, saturated or supersaturated. Concentration is expressed as molarity (moles per dm3) or percentage. Solubility is the grams of solute dissolving in 100 g of solvent at a given temperature. Solutions have particles below 1 nm, suspensions above 1000 nm and colloids in between (they show the Tyndall effect).","Solution solute aur solvent ka yaksan mixture hai. Ye unsaturated, saturated ya supersaturated ho sakta hai. Concentration molarity (mole per dm3) ya percentage mein batate hain. Solubility 100 g solvent mein ghulne wale solute ke gram hain. Colloid Tyndall effect dikhata hai, suspension mein zarray bade hote hain.",["Solute","Solvent","Saturated solution","Molarity","Colloid","Tyndall effect"],["Differentiate between solution, suspension and colloid.","Define solubility.","What is a saturated solution?"]],
["Electrochemistry","Oxidation is loss of electrons and reduction is gain of electrons (OIL RIG); both happen together in redox reactions. Electrolysis uses electricity to decompose a compound. An electrochemical cell such as the Daniell cell turns chemical energy into electrical energy. An alloy is a mixture of a metal with other elements, e.g. brass and steel.","Oxidation mein electron khote hain aur reduction mein hasil hote hain (OIL RIG); redox mein dono saath hote hain. Electrolysis bijli se compound ko todta hai. Daniell cell jaisa electrochemical cell kimiyai energy ko bijli mein badalta hai. Alloy metal ka doosre elements ke saath mixture hai, jaise brass aur steel.",["Oxidation","Reduction","Redox reaction","Electrolysis","Daniell cell","Alloy"],["Define oxidation and reduction.","Describe the Daniell cell.","What are alloys? Give two examples."]],
["Chemical Reactivity","Metals form positive ions and are arranged in a reactivity series: potassium, sodium, calcium, magnesium, aluminium, zinc, iron, lead, copper, silver, gold. More reactive metals displace less reactive ones from solutions and react with water, acids and oxygen. Non-metals gain electrons; among halogens reactivity decreases down the group (fluorine most reactive).","Metals musbat ion banate hain aur reactivity series mein tarteeb se hote hain: potassium, sodium, calcium, magnesium, aluminium, zinc, iron, lead, copper, silver, gold. Zyada reactive metal kam reactive ko uske mehlool se hata deta hai. Non-metals electron hasil karte hain; halogens mein neeche jaane par reactivity kam hoti hai.",["Reactivity series","Displacement","Metal","Non-metal","Halogen"],["Write the reactivity series of metals.","What happens when zinc is added to copper sulphate solution?","Compare reactivity of halogens."]]
]},
chem10:{sub:"chem",cls:10,src:"BSEK reduced syllabus 2024-25. Titles of chapters 1-4 follow the national curriculum; confirm numbering with your textbook",papers:[["All 10th past papers (Chemistry paper not listed separately)",PP+"10th-past-papers.aspx"],["BSEK official site","https://bsek.edu.pk"]],units:[
["Chemical Equilibrium","In a reversible reaction products can react back to form reactants. Equilibrium is reached when forward and backward rates are equal and concentrations stay constant. The equilibrium constant is Kc = [products]/[reactants] raised to their coefficients. Le Chatelier's principle: a system at equilibrium shifts to oppose a change in concentration, pressure or temperature.","Ulatne wali (reversible) reaction mein products wapas reactants ban sakte hain. Jab aage aur peeche ki raftar barabar ho jaye to equilibrium hota hai aur concentration nahi badalti. Kc = [products]/[reactants]. Le Chatelier ka usool: tabdeeli aane par system usay kam karne ki taraf hat jata hai.",["Reversible reaction","Equilibrium constant","Le Chatelier's principle","Dynamic equilibrium"],["Define dynamic equilibrium.","Write the expression of Kc for N2 + 3H2 <-> 2NH3.","State Le Chatelier's principle."]],
["Acids, Bases and Salts","Acids give H+ in water and bases give OH-. The pH scale runs 0 to 14: below 7 acidic, 7 neutral, above 7 basic. Acids turn blue litmus red; bases turn red litmus blue. Acid + base gives salt + water (neutralisation). Strong acids ionise completely, weak acids partly.","Acid pani mein H+ aur base OH- dete hain. pH scale 0 se 14 tak hai: 7 se kam acidic, 7 neutral, 7 se zyada basic. Acid neeli litmus ko surkh aur base surkh litmus ko neela karta hai. Acid + base = namak + pani (neutralisation).",["pH scale","Neutralisation","Strong acid","Weak acid","Litmus","Salt"],["Define acid and base (Arrhenius).","What is neutralisation? Give an equation.","Differentiate between strong and weak acids."]],
["Organic Chemistry","Organic chemistry studies carbon compounds. Carbon forms four bonds and long chains (catenation). Compounds are classified by functional groups such as alcohol (-OH), aldehyde (-CHO), ketone (>C=O), carboxylic acid (-COOH), ester and amine. Sources include coal, petroleum and natural gas.","Organic chemistry carbon ke compounds ka mutalia hai. Carbon chaar bond banata hai aur lambi zanjeerein (catenation) banata hai. Compounds ko functional group se baantte hain: alcohol (-OH), aldehyde (-CHO), ketone, carboxylic acid (-COOH). Zariye: koyla, petroleum aur natural gas.",["Catenation","Functional group","Alcohol","Carboxylic acid","Petroleum"],["Define catenation.","What is a functional group? Give four examples.","Name sources of organic compounds."]],
["Hydrocarbons","Hydrocarbons contain only carbon and hydrogen. Alkanes are saturated (CnH2n+2, methane, ethane); alkenes have a double bond (CnH2n, ethene); alkynes have a triple bond (CnH2n-2, ethyne). Alkanes undergo substitution; alkenes and alkynes undergo addition. Unsaturation is tested with bromine water, which decolourises.","Hydrocarbon mein sirf carbon aur hydrogen hote hain. Alkanes saturated (CnH2n+2, methane, ethane), alkenes mein double bond (CnH2n, ethene), alkynes mein triple bond (CnH2n-2, ethyne). Alkanes mein substitution aur alkenes mein addition hota hai. Bromine water ka rang udna unsaturation batata hai.",["Alkane","Alkene","Alkyne","Saturated","Addition reaction"],["Write the general formulas of alkanes, alkenes and alkynes.","How can you distinguish alkane from alkene?","Name the first four alkanes."]],
["Environmental Chemistry I: The Atmosphere","The atmosphere is mainly nitrogen (78 percent) and oxygen (21 percent) with small amounts of argon and carbon dioxide. Pollutants include carbon monoxide, sulphur dioxide and oxides of nitrogen. Acid rain forms when SO2 and NOx dissolve in rain, damaging buildings and aquatic life. The greenhouse effect traps heat through CO2 and methane and drives global warming.","Fiza mein 78 fisad nitrogen aur 21 fisad oxygen hai, baqi argon aur CO2. Pollutants: carbon monoxide, sulphur dioxide aur nitrogen oxides. SO2 aur NOx baarish mein mil kar acid rain banate hain jo imaratein aur aabi zindagi kharab karti hain. Greenhouse effect CO2 aur methane se garmi qaid karta hai.",["Atmosphere","Acid rain","Greenhouse effect","Global warming","Pollutant"],["Give the composition of the atmosphere.","What is acid rain? How is it formed?","Explain the greenhouse effect."]],
["Environmental Chemistry II: Water","Hard water contains calcium and magnesium salts and does not lather easily; soft water lathers well. Temporary hardness (bicarbonates) is removed by boiling; permanent hardness (chlorides, sulphates) by washing soda. Water pollutants include sewage, industrial waste and pesticides, and cause diseases such as cholera, typhoid and hepatitis.","Sakht (hard) pani mein calcium aur magnesium ke namak hote hain aur jhag mushkil se banta hai; naram pani mein jhag achha banta hai. Wuqti sakhti ubalne se aur mustaqil sakhti washing soda se door hoti hai. Pani ke pollutants (gandagi, factory ka kachra, keera maar dawaiyan) cholera, typhoid aur hepatitis phailate hain.",["Hard water","Soft water","Temporary hardness","Permanent hardness","Water pollution"],["Differentiate between temporary and permanent hardness.","How is hard water softened?","Name diseases caused by polluted water."]],
["Analytical Chemistry","Qualitative analysis finds what substances are present (e.g. flame test, tests for ions); quantitative analysis finds how much (e.g. titration). Advanced instrumental methods include chromatography, spectroscopy and mass spectrometry, which are fast and need very small samples.","Qualitative analysis batati hai ke kya maujood hai (flame test, ion tests); quantitative analysis batati hai kitna hai (titration). Jadeed tareeqe chromatography, spectroscopy aur mass spectrometry hain jo tez hain aur bohat thora sample mangte hain.",["Qualitative analysis","Quantitative analysis","Titration","Chromatography"],["Differentiate between qualitative and quantitative analysis.","What is chromatography?","Name two instrumental methods."]],
["Industrial Chemistry","Soap is made by saponification of fats or oils with sodium hydroxide. Soft drinks contain water, sugar, carbon dioxide, flavours and preservatives. The petroleum industry refines crude oil by fractional distillation into petrol, kerosene, diesel and bitumen. The pharmaceutical industry makes medicines such as antibiotics and painkillers.","Sabun fat ya tel ko sodium hydroxide se saponification karke banta hai. Soft drinks mein pani, cheeni, CO2, flavour aur preservative hote hain. Petroleum ko fractional distillation se petrol, kerosene, diesel aur bitumen mein alag kiya jata hai. Pharmaceutical industry dawaiyan banati hai.",["Saponification","Fractional distillation","Pharmaceutical","Preservative"],["How is soap prepared?","Name the fractions of petroleum.","What is the role of the pharmaceutical industry?"]]
]},
phy9:{sub:"phy",cls:9,src:"BSEK syllabus 2024-25 (9 units)",papers:[["English medium",PP+"karachi-board-9th-physics.aspx"],["Urdu medium",PP+"karachi-board-9th-physics-urdu-medium.aspx"]],units:[
["Physical Quantities and Measurement","Physical quantities are base (length, mass, time, current, temperature, amount, luminous intensity) or derived. SI units: metre, kilogram, second, ampere, kelvin, mole, candela. Vernier callipers measure to 0.1 mm and a micrometer screw gauge to 0.01 mm. Significant figures show the precision of a measurement.","Physical quantities base (length, mass, time, current...) ya derived hoti hain. SI units: metre, kilogram, second, ampere, kelvin, mole, candela. Vernier calliper 0.1 mm aur screw gauge 0.01 mm tak naapte hain. Significant figures naap ki durustgi batate hain.",["SI units","Base quantity","Vernier callipers","Screw gauge","Significant figures","Least count"],["Differentiate between base and derived quantities.","What is the least count of a vernier calliper?","Write the SI units of mass, time and length."]],
["Kinematics","Speed is distance/time (scalar); velocity is displacement/time (vector); acceleration is change in velocity per time. Equations of motion: v = u + at, s = ut + 1/2 at^2, 2as = v^2 - u^2. Free fall has g = 9.8 m/s^2. The slope of a distance-time graph is speed; the slope of a speed-time graph is acceleration and its area is distance.","Speed = distance/time (scalar); velocity = displacement/time (vector); acceleration = velocity mein tabdeeli/waqt. Equations: v = u + at, s = ut + 1/2 at^2, 2as = v^2 - u^2. Azad girne par g = 9.8 m/s^2. Distance-time graph ka slope speed deta hai; speed-time graph ka slope acceleration aur area distance hota hai.",["Speed","Velocity","Acceleration","Equations of motion","Free fall"],["Differentiate between speed and velocity.","A car starts from rest and reaches 20 m/s in 5 s. Find acceleration (4 m/s^2).","What does the slope of a speed-time graph show?"]],
["Dynamics","Newton's first law: an object stays at rest or in uniform motion unless a force acts (inertia). Second law: F = ma. Third law: every action has an equal and opposite reaction. Momentum p = mv and is conserved in collisions. Friction opposes motion. Centripetal force F = mv^2/r keeps an object in a circle.","Newton ka pehla qanoon: jab tak force na lage cheez apni halat (rest ya motion) mein rehti hai (inertia). Doosra: F = ma. Teesra: har action ka barabar aur ulta reaction hota hai. Momentum p = mv aur takrao mein mehfooz rehta hai. Friction harkat ka mukhalif hai.",["Inertia","Force","Momentum","Friction","Centripetal force"],["State Newton's three laws.","Define momentum and state the law of conservation.","How does friction help us? How can it be reduced?"]],
["Turning Effects of Forces","Torque = force x perpendicular distance from the pivot. Two forces equal and opposite but not in one line form a couple. For equilibrium: sum of forces is zero and sum of torques is zero (principle of moments). The centre of mass is where all mass seems concentrated; a low centre of mass gives stability.","Torque = force x pivot se perpendicular faasla. Do barabar ulti forces jo aik line mein na hon couple banati hain. Equilibrium mein forces ka majmua zero aur torques ka majmua zero hota hai. Centre of mass neecha ho to cheez zyada stable hoti hai.",["Torque","Couple","Equilibrium","Principle of moments","Centre of mass"],["Define torque.","State the two conditions of equilibrium.","Why is a bus with a low centre of mass stable?"]],
["Forces and Matter","Hooke's law: extension is proportional to the load within the elastic limit (F = kx). Pressure = force/area (pascal). Pressure in liquids rises with depth, P = (rho)gh. Pascal's law: pressure applied to a liquid is transmitted equally; hydraulic lifts use it.","Hooke ka qanoon: elastic limit tak khichao load ke mutanasib hota hai (F = kx). Pressure = force/area (pascal). Liquid mein gehrai ke saath pressure barhta hai, P = (rho)gh. Pascal ka qanoon: liquid par dala gaya pressure barabar muntaqil hota hai.",["Hooke's law","Elastic limit","Pressure","Pascal's law","Hydraulic press"],["State Hooke's law.","Define pressure and give its unit.","How does a hydraulic lift work?"]],
["Gravitation","Newton's law: F = G m1 m2 / r^2, where G = 6.67 x 10^-11 N m^2/kg^2. Weight W = mg, with g = 9.8 m/s^2 on Earth. Mass stays the same everywhere but weight changes with g. The mass of the Earth can be found from g = GM/R^2.","Newton ka qanoon: F = G m1 m2 / r^2, G = 6.67 x 10^-11. Wazan W = mg, zameen par g = 9.8 m/s^2. Mass har jagah same rehta hai jabke wazan g ke saath badalta hai. Zameen ka mass g = GM/R^2 se nikalte hain.",["Gravitation","Gravitational constant","Weight","Mass","Acceleration due to gravity"],["State Newton's law of gravitation.","Differentiate between mass and weight.","Why does weight change on the Moon?"]],
["Properties of Matter","The kinetic theory says matter is made of tiny particles in constant motion. In solids particles vibrate in fixed places; in liquids they slide past one another; in gases they move freely. Gas pressure comes from particles hitting the walls. Heating makes particles move faster.","Kinetic theory ke mutabiq maadda choti zarron se bana hai jo musalsal harkat mein hain. Solid mein zarre apni jagah hilte hain, liquid mein phisalte hain aur gas mein azadi se ghoomte hain. Gas ka pressure zarron ke deewar se takrane se banta hai.",["Kinetic theory","Particles","Gas pressure","Density"],["Describe the three states of matter using kinetic theory.","How do gases exert pressure?","Why does a gas expand on heating?"]],
["Energy Sources and Transfer of Energy","Work W = F x d (joule). Kinetic energy = 1/2 mv^2 and gravitational potential energy = mgh. Energy cannot be created or destroyed, only changed from one form to another. Power = work/time (watt). Sources: fossil fuels, solar, wind, hydro, nuclear and geothermal.","Kaam W = F x d (joule). Harkat ki energy = 1/2 mv^2 aur potential energy = mgh. Energy na paida hoti hai na khatam, sirf shakal badalti hai. Power = kaam/waqt (watt). Zariye: fossil fuels, solar, hawa, pani, nuclear aur geothermal.",["Work","Kinetic energy","Potential energy","Power","Conservation of energy"],["Define work and power.","A 2 kg body is lifted 5 m. Find PE (about 98 J).","State the law of conservation of energy."]],
["Thermal Properties of Matter","Heat is energy transfer due to temperature difference; temperature measures hotness. Specific heat capacity c is the heat to raise 1 kg of a substance by 1 K, Q = mc(change in T). Latent heat of fusion is the heat to melt a solid at its melting point; latent heat of vaporisation boils a liquid. Heat spreads by conduction, convection and radiation.","Heat garmi ki energy ka muntaqil hona hai, temperature garmi ka paimana hai. Specific heat 1 kg ko 1 K garam karne ki heat hai, Q = mc(change in T). Latent heat of fusion pighlane aur latent heat of vaporisation ubalne ke liye hoti hai. Heat conduction, convection aur radiation se phailti hai.",["Heat","Temperature","Specific heat","Latent heat","Conduction","Convection","Radiation"],["Differentiate between heat and temperature.","Define specific heat capacity.","Why does boiling water stay at 100 C while heating?"]]
]},
phy10:{sub:"phy",cls:10,src:"BSEK syllabus 2024-25 (units 10 to 20)",papers:[["English medium",PP+"karachi-board-10th-physics-english-medium.aspx"],["Urdu medium",PP+"karachi-board-10th-physics-urdu-medium.aspx"]],units:[
["General Properties of Waves","A wave transfers energy without transferring matter. Transverse waves vibrate at right angles to travel (light, water); longitudinal waves vibrate along it (sound). Wave speed v = f x wavelength. Waves show reflection, refraction, diffraction and interference. A ripple tank shows these.","Mauj energy muntaqil karti hai, maadda nahi. Transverse mauj travel ke ru-baru (light, pani) aur longitudinal mauj usi rukh mein (sound) hoti hai. Raftar v = f x wavelength. Mauj mein reflection, refraction, diffraction aur interference hota hai.",["Transverse wave","Longitudinal wave","Frequency","Wavelength","Amplitude"],["Differentiate between transverse and longitudinal waves.","A wave has f = 50 Hz and wavelength 2 m. Find speed (100 m/s).","What is diffraction?"]],
["Sound","Sound needs a medium and travels as longitudinal waves of compressions and rarefactions. Speed in air is about 332 m/s at 0 C and faster in solids. Pitch depends on frequency and loudness on amplitude. An echo is reflected sound heard after at least 0.1 s. Audible range is 20 Hz to 20 kHz; ultrasound is above it.","Awaaz ko medium chahiye aur wo compressions aur rarefactions ki longitudinal mauj hai. Hawa mein raftar taqreeban 332 m/s hai. Pitch frequency aur loudness amplitude par hoti hai. Goonj kam az kam 0.1 s baad sunayi deti hai. Sunai dene ki hadd 20 Hz se 20 kHz hai.",["Echo","Pitch","Loudness","Ultrasound","Compression"],["Why can sound not travel in vacuum?","Differentiate between pitch and loudness.","What are the uses of ultrasound?"]],
["Electromagnetic Spectrum","Electromagnetic waves travel in vacuum at 3 x 10^8 m/s. In order of increasing frequency: radio waves, microwaves, infrared, visible light, ultraviolet, X-rays, gamma rays. Uses: communication, cooking, remote controls, vision, sterilising, medical imaging and cancer treatment. High-frequency waves are harmful.","EM mauj khala mein 3 x 10^8 m/s se chalti hain. Frequency ke hisaab se: radio, microwave, infrared, nazar aane wali roshni, ultraviolet, X-rays, gamma rays. Istemal: rabta, khana pakana, remote, tibbi imaging. Zyada frequency wali mauj nuqsan deh hain.",["Radio waves","Microwaves","Infrared","X-rays","Gamma rays"],["Write the EM spectrum in order.","Give one use of each: infrared, X-rays, microwaves.","What is the speed of EM waves?"]],
["Geometrical Optics","Reflection: angle of incidence equals angle of reflection. Mirrors (concave and convex) follow 1/f = 1/p + 1/q. Refraction is bending of light between media; refractive index n = sin i / sin r. Total internal reflection occurs beyond the critical angle (optical fibres). Convex lenses converge and concave lenses diverge light. Short sight is corrected by concave lenses, long sight by convex.","Reflection mein zawiya-e-wuqu aur zawiya-e-in'ikas barabar hote hain. Aaine 1/f = 1/p + 1/q par chalte hain. Refraction mein roshni do medium ke darmiyan mur jati hai, n = sin i / sin r. Critical angle ke baad total internal reflection hota hai (optical fibre). Short sight concave aur long sight convex lens se theek hoti hai.",["Reflection","Refraction","Refractive index","Total internal reflection","Lens","Focal length"],["State the laws of reflection.","Define refractive index.","What is total internal reflection? Give its uses."]],
["Electrostatics","There are two kinds of charge; like charges repel and unlike attract. Charging is by friction, contact and induction. Coulomb's law: F = k q1 q2 / r^2. Electric field is force per unit charge. Potential difference is work per unit charge (volt). A capacitor stores charge, C = Q/V (farad).","Charge do qisam ka hota hai; ek jaise door aur ulte qareeb aate hain. Charge ragar, chhune aur induction se hota hai. Coulomb ka qanoon: F = k q1 q2 / r^2. Electric field ek unit charge par force hai. Potential difference ek unit charge par kaam hai (volt). Capacitor charge jama karta hai, C = Q/V.",["Coulomb's law","Electric field","Potential difference","Capacitor","Induction"],["State Coulomb's law.","Define electric potential difference.","What is a capacitor?"]],
["Current Electricity","Current I = Q/t (ampere). Ohm's law: V = IR. Resistors in series add: R = R1 + R2; in parallel 1/R = 1/R1 + 1/R2. Electric power P = VI and energy E = Pt. Joule's law: heat produced is I^2 R t. EMF is the energy given per unit charge by a source. DC flows one way; AC reverses direction.","Current I = Q/t (ampere). Ohm ka qanoon: V = IR. Series mein R = R1 + R2; parallel mein 1/R = 1/R1 + 1/R2. Power P = VI aur energy E = Pt. Joule ka qanoon: heat = I^2 R t. DC aik taraf behta hai jabke AC rukh badalta hai.",["Ohm's law","Resistance","Series circuit","Parallel circuit","Electric power","EMF"],["State Ohm's law.","Find the equivalent resistance of 4 ohm and 6 ohm in series (10 ohm).","What is Joule's law?"]],
["Electromagnetism","A current in a wire produces a magnetic field. A current-carrying wire in a magnetic field feels a force (the motor principle; Fleming's left-hand rule). An AC generator turns motion into electricity by electromagnetic induction. A transformer changes AC voltage: Vs/Vp = Ns/Np.","Tar mein current magnetic field banata hai. Magnetic field mein current wale tar par force lagta hai (motor ka usool, Fleming ka left-hand rule). AC generator harkat ko bijli mein badalta hai (electromagnetic induction). Transformer AC voltage badalta hai: Vs/Vp = Ns/Np.",["Magnetic field","Electromagnetic induction","Generator","Transformer","Motor"],["State Fleming's left-hand rule.","How does an AC generator work?","Differentiate between step-up and step-down transformers."]],
["Introductory Electronics","Analogue signals vary continuously; digital signals have two levels (0 and 1). Moving electrons are deflected by electric and magnetic fields (as in a cathode ray tube). Logic gates: AND (output 1 only if both inputs are 1), OR (1 if any input is 1), NOT (inverts), NAND and NOR.","Analogue signal musalsal badalta hai; digital signal ke do level (0 aur 1) hote hain. Chalte hue electron electric aur magnetic field se mur jate hain. Logic gates: AND (dono 1 hon to 1), OR (koi aik 1 ho to 1), NOT (ulta), NAND aur NOR.",["Analogue","Digital","Logic gate","Truth table","Cathode ray"],["Differentiate between analogue and digital electronics.","Draw the truth table of an AND gate.","What does a NOT gate do?"]],
["Information and Communication Technology","A computer-based information system (CBIS) has hardware, software, data, people and procedures. Information flows from sender through a channel to a receiver. Optical fibres carry light signals by total internal reflection with little loss. Word processing creates documents; data management stores and retrieves records.","CBIS mein hardware, software, data, log aur tareeqay hote hain. Maloomat sender se channel ke zariye receiver tak jati hain. Optical fibre total internal reflection se roshni ke signal kam nuqsan ke saath le jata hai. Word processing se documents banate hain.",["CBIS","Optical fibre","Word processing","Database"],["What is CBIS?","How does an optical fibre transmit signals?","Name the uses of word processing."]],
["Atomic Structure","The atom has a nucleus (protons and neutrons) surrounded by electrons. Atomic number Z is the number of protons; mass number A is protons plus neutrons. An element is defined by Z. Isotopes are atoms of the same element with different neutron numbers.","Atom ke nucleus mein proton aur neutron hote hain aur bahar electron. Atomic number Z proton ki tadaad hai, mass number A proton aur neutron ka majmua. Element Z se pehchana jata hai. Isotopes aik element ke wo atom hain jinme neutron alag hon.",["Nucleus","Atomic number","Mass number","Isotope"],["Define atomic number and mass number.","What are isotopes? Give an example.","Describe the structure of an atom."]],
["Nuclear Physics","Radioactive nuclei emit alpha (helium nucleus), beta (electron) and gamma (EM wave) radiation; gamma penetrates most, alpha least. Background radiation comes from rocks, cosmic rays and medical sources. Fission splits a heavy nucleus (uranium) releasing energy; fusion joins light nuclei (hydrogen) as in the Sun. Uses include power, medicine and carbon dating.","Radioactive nucleus alpha (helium nucleus), beta (electron) aur gamma (EM mauj) nikalta hai; gamma sabse zyada aur alpha sabse kam ghusta hai. Background radiation chattanon, cosmic rays aur tibbi zariyon se aati hai. Fission mein bhaari nucleus tootta hai (uranium), fusion mein halke nuclei milte hain (Sooraj mein). Istemal: bijli, ilaj aur carbon dating.",["Radioactivity","Alpha particle","Beta particle","Gamma ray","Fission","Fusion"],["Compare alpha, beta and gamma radiation.","Differentiate between fission and fusion.","What is background radiation?"]]
]},
com9:{sub:"com",cls:9,src:"BSEK syllabus 2024-25 (7 chapters)",papers:[["English medium",PP+"karachi-board-9th-computer-studies-english-medium.aspx"]],units:[
["Fundamentals of Computer","A computer is an electronic device that takes input, processes it, stores it and gives output. Computers evolved through five generations (vacuum tubes, transistors, ICs, microprocessors, AI). By size they are super, mainframe, mini and micro computers. Hardware includes the system unit, input devices (keyboard, mouse, scanner), output devices (monitor, printer) and storage (hard disk, USB). Software is system software or application software.","Computer aik electronic machine hai jo input leti, process karti, store karti aur output deti hai. Iski paanch generations hain (vacuum tube, transistor, IC, microprocessor, AI). Size ke hisaab se super, mainframe, mini aur micro computer hote hain. Hardware mein system unit, input (keyboard, mouse), output (monitor, printer) aur storage aati hai.",["Hardware","Software","Input device","Output device","Storage","Microprocessor"],["Define computer.","Name the generations of computers.","Differentiate between system software and application software."]],
["Operating Systems","An operating system manages hardware and software and gives users an interface: command line (CLI) or graphical (GUI). Types: single-user, multi-user, batch processing, time-sharing and real-time. Examples are Windows, Linux and Android. Installing Windows means booting from the installation media and following the setup steps.","Operating system hardware aur software ko sambhalta hai aur user ko interface deta hai: command line (CLI) ya graphical (GUI). Qismein: single-user, multi-user, batch, time-sharing aur real-time. Misalein: Windows, Linux, Android.",["Operating system","GUI","CLI","Batch processing","Real-time OS"],["Define operating system and write its functions.","Differentiate between CLI and GUI.","Explain time-sharing and real-time systems."]],
["Office Automation (MS Word and Excel)","In MS Word you can use the Page Layout tab, create a table of contents from headings, and type in Urdu and Sindhi with language settings. In MS Excel the interface has rows, columns and cells; you can sort data, use formulas such as =SUM(A1:A5) and make charts.","MS Word mein Page Layout tab, headings se table of contents aur Urdu/Sindhi typing hoti hai. MS Excel mein rows, columns aur cells hote hain; data sort kar sakte hain, formulas jaise =SUM(A1:A5) istemal kar sakte hain aur chart bana sakte hain.",["Table of contents","Cell","Formula","Sorting","Chart"],["How do you create a table of contents in Word?","Write the formula for adding cells A1 to A5.","How do you make a chart in Excel?"]],
["Data Communication and Networks","Data communication is the exchange of data between devices. A system has a sender, receiver, message, medium and protocol. Media are guided (twisted pair, coaxial, fibre optic) or unguided (radio, microwave, satellite). Devices: switch, router, modem and NIC. Networks are LAN, MAN and WAN with bus, ring or star topology. The OSI model has seven layers; TCP/IP is the internet model; an IPv4 address has four numbers (0 to 255).","Data communication mein devices ke darmiyan data ka tabadla hota hai. Sender, receiver, message, medium aur protocol iske hisse hain. Medium guided (twisted pair, coaxial, fibre) ya unguided (radio, satellite) hota hai. Devices: switch, router, modem, NIC. Network LAN, MAN, WAN hote hain; topology bus, ring ya star. OSI ke saat layers hote hain.",["LAN","WAN","Router","Topology","OSI model","IP address"],["Differentiate between LAN and WAN.","Describe star topology with advantages.","Write the seven layers of the OSI model."]],
["Computer Security","Cybercrime is crime using computers and networks, such as hacking and fraud. Malware includes viruses, worms and trojans, which spread through email, downloads and USB drives. Antivirus software detects and removes malware. Authentication proves identity using passwords, PINs or biometrics such as fingerprints.","Cybercrime computer aur network se hone wala jurm hai, jaise hacking aur fraud. Malware mein virus, worm aur trojan aate hain jo email, download aur USB se phailte hain. Antivirus malware pakar kar hata deta hai. Authentication password, PIN ya fingerprint se pehchan sabit karta hai.",["Cybercrime","Virus","Malware","Antivirus","Authentication","Biometrics"],["Define cybercrime.","How do viruses spread?","Name three authentication methods."]],
["Web Development (HTML)","HTML is the markup language for web pages. A page has <html>, <head> (with <title>) and <body>. Headings use <h1> to <h6>, paragraphs <p>, line break <br>, bold <b>, italic <i>. Lists are <ul>, <ol> and <li>. Images use <img src=..>, links <a href=..>, and tables use <table>, <tr>, <th> and <td>.","HTML web page banane ki markup language hai. Page mein <html>, <head> (<title> ke saath) aur <body> hote hain. Heading <h1> se <h6>, paragraph <p>, line break <br>, bold <b>, italic <i>. List ke liye <ul>, <ol>, <li>. Image <img src=..>, link <a href=..>, table <table>, <tr>, <th>, <td>.",["HTML","Tag","Hyperlink","Table","List"],["What is HTML? Write the basic structure of a page.","Write the tag to insert an image.","How do you create an ordered list?"]],
["Database","A database is an organised collection of data. A DBMS manages it; compared to flat files it reduces repetition, improves security and allows easier searching. Main parts are tables, fields (columns), records (rows) and keys. A primary key uniquely identifies a record and a foreign key links tables. The ER model shows entities and relationships.","Database data ka tarteeb war majmua hai. DBMS usay sambhalta hai; flat file ke muqable mein dohrao kam, security behtar aur search aasan hoti hai. Table, field (column), record (row) aur key iske hisse hain. Primary key har record ko alag pehchanti hai aur foreign key tables ko jorti hai.",["DBMS","Field","Record","Primary key","ER model"],["Define database and DBMS.","Differentiate between flat file and DBMS.","What is a primary key?"]]
]},

["Problem Solving and Algorithm Design","Problem solving means understanding a problem, planning, carrying it out and checking. An algorithm is a finite list of steps to solve a problem. A flowchart draws it with symbols: oval (start/stop), parallelogram (input/output), rectangle (process), diamond (decision), arrows for flow. Data structures such as arrays organise data.","Masla hal karna: masla samajhna, mansooba banana, amal karna aur jaanchna. Algorithm masle ko hal karne ke mehdood qadmon ki fehrist hai. Flowchart ismein symbols se dikhata hai: oval (start/stop), parallelogram (input/output), rectangle (process), diamond (faisla). Array jaisi data structure data ko tarteeb deti hai.",["Algorithm","Flowchart","Decision symbol","Array"],["Define algorithm.","Name the flowchart symbols and their uses.","Write an algorithm to find the largest of two numbers."]],
["Basics of Programming in C++","A program is a set of instructions. A C++ program begins with #include <iostream> and int main() { ... }. Variables store data and have types: int, float, double, char. Constants do not change (const). Statements end with a semicolon. The compiler translates the code into machine language.","Program hidayat ka majmua hai. C++ program #include <iostream> aur int main() { ... } se shuru hota hai. Variable data rakhta hai aur uski type hoti hai: int, float, double, char. Constant badalta nahi (const). Har statement semicolon par khatam hota hai. Compiler code ko machine language mein badalta hai.",["Variable","Data type","Constant","Compiler","int main"],["What is a variable? Give its rules.","Name the basic data types in C++.","Write a program that prints Hello."]],
["Input/Output Handling in C++","cout << prints output and cin >> reads input. Comments use // for one line and /* ... */ for many lines. Arithmetic operators are + - * / %; relational operators are == != < > <= >=; logical operators are && || !. Operator precedence decides the order of evaluation.","cout << output deta hai aur cin >> input leta hai. Comment ke liye // (aik line) aur /* ... */ (kai lines) hote hain. Arithmetic operators + - * / %, relational == != < > <= >=, logical && || !. Operator precedence hisaab ki tarteeb tay karti hai.",["cout","cin","Operator","Comment","Precedence"],["Differentiate between cin and cout.","Write the types of operators.","Write a program that adds two numbers."]],
["Control Structures","Selection chooses a path: if, if-else and switch. Iteration repeats code: for (known count), while (checks first) and do-while (runs at least once). Example: for(int i=1;i<=5;i++){ cout<<i; } prints 1 to 5. Break exits a loop and continue skips to the next turn.","Selection raasta chunta hai: if, if-else aur switch. Iteration code dohrata hai: for (tadaad maloom ho), while (pehle jaanchta hai) aur do-while (kam az kam aik baar chalta hai). break loop se bahar nikalta hai aur continue agli baari par jata hai.",["if-else","switch","for loop","while loop","do-while"],["Differentiate between while and do-while.","Write a program to print 1 to 10 using a for loop.","Write the syntax of if-else."]],
["Digital Logic and Design","Computers store data in binary (0 and 1). Number systems: binary (base 2), octal (8), decimal (10) and hexadecimal (16). Logic gates AND, OR, NOT, NAND, NOR, XOR build digital circuits and are described by truth tables.","Computer data binary (0 aur 1) mein rakhta hai. Number systems: binary (2), octal (8), decimal (10), hexadecimal (16). Logic gates AND, OR, NOT, NAND, NOR, XOR digital circuit banate hain aur truth table se samjhaye jate hain.",["Binary","Hexadecimal","Logic gate","Truth table","Bit and byte"],["Convert 1010 binary to decimal (10).","Draw the truth table of an OR gate.","List the number systems."]],
["Introduction to Scratch","Scratch is a block-based visual programming language. The stage is where the project plays and sprites are the characters. Blocks come in groups such as Motion, Looks, Sound, Events and Control. Snapping blocks together makes a script, for example when the green flag is clicked, move 10 steps and repeat.","Scratch blocks wali visual programming language hai. Stage wo jagah hai jahan project chalta hai aur sprite kirdar hain. Blocks ke group: Motion, Looks, Sound, Events, Control. Blocks jor kar script banti hai, jaise green flag dabne par 10 qadam chalo aur dohrao.",["Sprite","Stage","Script","Block","Green flag"],["What is Scratch?","Differentiate between a sprite and the stage.","Name the block categories in Scratch."]]
]}

var ORDER=[9,10];
var st={cls:9,lang:"en",done:{}};
try{var s=localStorage.getItem("ssg");if(s){var o=JSON.parse(s);st.done=o.done||{};st.cls=o.cls||9;st.lang=o.lang||"en"}}catch(e){}
function save(){try{localStorage.setItem("ssg",JSON.stringify({done:st.done,cls:st.cls,lang:st.lang}))}catch(e){}}
function keysFor(c){return Object.keys(D).filter(function(k){return D[k].cls===c})}
function icon(k){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[k]+'</svg>'}
function prog(k){var n=D[k].units.length,d=0;for(var i=0;i<n;i++)if(st.done[k+"-"+i])d++;return [d,n]}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var app=document.getElementById("app");
function view(){
  var h=location.hash.replace("#","")||"home";
  var p=h.split("-");
  if(h==="home")return home();
  if(h==="search")return search();
  if(h==="papers")return papers();
  if(p[0]==="subject")return subject(p[1]);
  if(p[0]==="unit")return unit(p[1],+p[2]);
  return home();
}
function hero(title,sub,toggle){
  return '<header class="hero"><div class="wrap"><small>Sindh Board - SSC</small><h1>'+title+'</h1><p>'+sub+'</p>'+(toggle?'<div class="seg" role="group" aria-label="Class"><button data-cls="9" aria-pressed="'+(st.cls===9)+'">Class 9</button><button data-cls="10" aria-pressed="'+(st.cls===10)+'">Class 10</button></div>':'')+'</div></header>';
}
function home(){
  var ks=keysFor(st.cls),tot=0,dn=0;
  var cards=ks.map(function(k){var d=D[k],s=SUBS[d.sub],pr=prog(k);tot+=pr[1];dn+=pr[0];
    return '<a class="card subj" style="--c:'+s[1]+';--w:'+Math.round(pr[0]/pr[1]*100)+'%" href="#subject-'+k+'"><span class="badge">'+icon(d.sub)+'</span><b>'+s[0]+'</b><small>'+pr[1]+' chapters, '+pr[0]+' done</small><span class="bar"><i></i></span></a>'}).join("");
  app.innerHTML=hero("Science, chapter by chapter","Pick your class and subject. Every chapter has a short explanation, key terms and practice questions.",true)+
   '<div class="wrap"><div class="sec"><h2>Class '+st.cls+' subjects</h2><span>'+dn+' of '+tot+' chapters done</span></div><div class="grid">'+cards+'</div>'+
   '<p class="note" style="margin-top:18px">Questions are practice questions written from the board syllabus. They are not copies of past papers. Open the Papers tab for real past papers.</p></div>';
  bindSeg();
}
function bindSeg(){Array.prototype.forEach.call(app.querySelectorAll("[data-cls]"),function(b){b.onclick=function(){st.cls=+b.dataset.cls;save();view()}})}
function subject(k){
  var d=D[k];if(!d)return home();var s=SUBS[d.sub];
  var rows=d.units.map(function(u,i){var on=st.done[k+"-"+i];
   return '<a class="card row" href="#unit-'+k+'-'+i+'"><span class="num">'+(i+1)+'</span><span><b>'+esc(u[0])+'</b><small>'+esc(u[3].slice(0,3).join(", "))+'</small></span><span class="tick'+(on?' on':'')+'" role="img" aria-label="'+(on?'Done':'Not done')+'"></span></a>'}).join("");
  app.innerHTML=hero(s[0]+" - Class "+d.cls,d.src,false)+
   '<div class="wrap" style="--c:'+s[1]+'"><div class="top"><button class="back" id="bk">Back</button></div><div class="list">'+rows+'</div></div>';
  document.getElementById("bk").onclick=function(){location.hash="home"};
}
function unit(k,i){
  var d=D[k];if(!d||!d.units[i])return home();var u=d.units[i],s=SUBS[d.sub],on=st.done[k+"-"+i];
  var ur=st.lang==="ur";
  app.innerHTML=hero(esc(u[0]),s[0]+" - Class "+d.cls+", chapter "+(i+1),false)+
   '<div class="wrap" style="--c:'+s[1]+'"><div class="top"><button class="back" id="bk">Chapters</button></div>'+
   '<div class="lang" role="group" aria-label="Language"><button data-l="en" aria-pressed="'+!ur+'">English</button><button data-l="ur" aria-pressed="'+ur+'">Roman Urdu</button></div>'+
   '<div class="body"><p>'+esc(u[ur?2:1])+'</p></div>'+
   '<div class="sec"><h2>Key terms</h2></div><div class="chips">'+u[3].map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join("")+'</div>'+
   '<div class="sec"><h2>Practice questions</h2></div><ol class="qs">'+u[4].map(function(q){return '<li>'+esc(q)+'</li>'}).join("")+'</ol>'+
   '<button class="cta'+(on?' off':'')+'" id="dn">'+(on?'Marked as done (tap to undo)':'Mark chapter as done')+'</button>'+
   '<div class="navrow"><button id="pv" '+(i===0?'disabled':'')+'>Previous</button><button id="nx" '+(i===d.units.length-1?'disabled':'')+'>Next</button></div></div>';
  document.getElementById("bk").onclick=function(){location.hash="subject-"+k};
  document.getElementById("dn").onclick=function(){if(st.done[k+"-"+i])delete st.done[k+"-"+i];else st.done[k+"-"+i]=1;save();unit(k,i)};
  document.getElementById("pv").onclick=function(){location.hash="unit-"+k+"-"+(i-1)};
  document.getElementById("nx").onclick=function(){location.hash="unit-"+k+"-"+(i+1)};
  Array.prototype.forEach.call(app.querySelectorAll("[data-l]"),function(b){b.onclick=function(){st.lang=b.dataset.l;save();unit(k,i)}});
  window.scrollTo(0,0);
}
function search(q){
  q=q||"";
  app.innerHTML=hero("Find a topic","Type any word, like reproduction, Ohm, mole or HTML.",false)+
   '<div class="wrap"><label for="q" class="sr" style="position:absolute;left:-9999px">Search topics</label><input id="q" class="search" type="search" placeholder="Search all chapters, Class 9 and 10" value="'+esc(q)+'" autocomplete="off"><div id="res" class="list" style="margin-top:14px"></div></div>';
  var inp=document.getElementById("q");inp.oninput=function(){run(inp.value)};run(q);
}
function run(q){
  var res=document.getElementById("res"),t=q.trim().toLowerCase();
  if(t.length<2){res.innerHTML='<p class="note">Start typing to search '+Object.keys(D).reduce(function(a,k){return a+D[k].units.length},0)+' chapters.</p>';return}
  var out=[];
  Object.keys(D).forEach(function(k){D[k].units.forEach(function(u,i){
    var hay=(u[0]+" "+u[1]+" "+u[2]+" "+u[3].join(" ")+" "+u[4].join(" ")).toLowerCase();
    if(hay.indexOf(t)>-1){var sc=(u[0].toLowerCase().indexOf(t)>-1?3:0)+(u[3].join(" ").toLowerCase().indexOf(t)>-1?2:0)+1;out.push([sc,k,i,u])}})});
  out.sort(function(a,b){return b[0]-a[0]});
  if(!out.length){res.innerHTML='<p class="note">Nothing found for "'+esc(q)+'". Try a shorter word or the English term.</p>';return}
  res.innerHTML=out.slice(0,20).map(function(r){var d=D[r[1]],s=SUBS[d.sub];
    return '<a class="card row" style="--c:'+s[1]+'" href="#unit-'+r[1]+'-'+r[2]+'"><span class="num">'+icon(d.sub).replace("<svg","<svg style=\"width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8\"")+'</span><span><b>'+esc(r[3][0])+'</b><small>'+s[0]+', Class '+d.cls+'</small></span><span></span></a>'}).join("");
}
function papers(){
  var body=ORDER.map(function(c){return '<div class="sec"><h2>Class '+c+'</h2></div>'+keysFor(c).map(function(k){var d=D[k],s=SUBS[d.sub];
    return '<div class="card" style="margin-bottom:10px"><b style="font-family:var(--font-d)">'+s[0]+'</b><div class="links" style="margin-top:8px">'+d.papers.map(function(p){return '<a href="'+p[1]+'" target="_blank" rel="noopener"><span>'+p[0]+'</span><span aria-hidden="true">&#8599;</span></a>'}).join("")+'</div></div>'}).join("")}).join("");
  app.innerHTML=hero("Past papers","Karachi board papers, opened on the source site.",false)+
   '<div class="wrap"><p class="note" style="margin-top:16px">These links open past paper pages on ilmkidunya.com and the board site. The practice questions inside the app come from the syllabus. A chapter-by-chapter count of which topics appeared in each year is not included yet, because it needs the papers themselves to be read and checked.</p>'+body+'</div>';
}
function tabs(){
  var h=location.hash.replace("#","")||"home",cur=h.indexOf("search")===0?"search":h.indexOf("papers")===0?"papers":"home";
  document.getElementById("tabs").innerHTML=[["home","Learn","home"],["search","Search","find"],["papers","Papers","paper"]].map(function(t){
    return '<button data-t="'+t[0]+'" '+(cur===t[0]?'aria-current="page"':'')+'>'+icon(t[2])+'<span>'+t[1]+'</span></button>'}).join("");
  Array.prototype.forEach.call(document.querySelectorAll("[data-t]"),function(b){b.onclick=function(){location.hash=b.dataset.t}});
}
function go(){view();tabs();window.scrollTo(0,0)}
window.addEventListener("hashchange",go);go();
</script>
